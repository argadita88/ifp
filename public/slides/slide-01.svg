<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="50%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg1)"/>
  <circle cx="1700" cy="150" r="300" fill="#38bdf8" opacity="0.15" filter="blur(60px)"/>
  <circle cx="200" cy="900" r="350" fill="#6366f1" opacity="0.12" filter="blur(80px)"/>

  <rect x="120" y="100" width="480" height="48" rx="24" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="2"/>
  <text x="360" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#facc15" text-anchor="middle" letter-spacing="1.5">PELATIHAN IFP · KURIKULUM MERDEKA</text>

  <text x="120" y="240" font-family="'Outfit', sans-serif" font-size="64" font-weight="900" fill="#ffffff">Gim Interaktif &amp; Pembelajaran Interaktif</text>
  <text x="120" y="320" font-family="'Outfit', sans-serif" font-size="64" font-weight="900" fill="url(#accent1)">Informatika SMP Layar Sentuh IFP</text>
  <text x="120" y="390" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="600" fill="#bae6fd">Inovasi Media Pembelajaran Terpadu Layar Sentuh Besar (Interactive Flat Panel 4K)</text>

  <g transform="translate(120, 450)">
    <rect x="0" y="0" width="520" height="480" rx="24" fill="url(#cardBg1)" stroke="rgba(186, 230, 253, 0.3)" stroke-width="2"/>
    <circle cx="70" cy="70" r="32" fill="#0284c7"/>
    <text x="70" y="78" font-family="sans-serif" font-size="28" fill="#ffffff" text-anchor="middle">🎮</text>
    <text x="120" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#ffffff">Multi-Touch IFP</text>
    <text x="40" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" fill="#e0f2fe">
      <tspan x="40" dy="0">• Dukungan 20 titik sentuhan simultan</tspan>
      <tspan x="40" dy="36">• Kolaborasi fisik 2–4 tim di layar besar</tspan>
      <tspan x="40" dy="36">• Antarmuka ergonomis ramah sentuhan</tspan>
    </text>

    <rect x="560" y="0" width="520" height="480" rx="24" fill="url(#cardBg1)" stroke="rgba(186, 230, 253, 0.3)" stroke-width="2"/>
    <circle cx="630" cy="70" r="32" fill="#10b981"/>
    <text x="630" y="78" font-family="sans-serif" font-size="28" fill="#ffffff" text-anchor="middle">📘</text>
    <text x="680" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#ffffff">Kurikulum Merdeka</text>
    <text x="600" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" fill="#e0f2fe">
      <tspan x="600" dy="0">• Pembelajaran Berpikir Komputasional</tspan>
      <tspan x="600" dy="36">• Dekomposisi, Abstraksi &amp; Pola</tspan>
      <tspan x="600" dy="36">• Algoritma &amp; Pemrograman Dasar</tspan>
    </text>

    <rect x="1120" y="0" width="560" height="480" rx="24" fill="url(#cardBg1)" stroke="rgba(186, 230, 253, 0.3)" stroke-width="2"/>
    <circle cx="1190" cy="70" r="32" fill="#6366f1"/>
    <text x="1190" y="78" font-family="sans-serif" font-size="28" fill="#ffffff" text-anchor="middle">🤖</text>
    <text x="1240" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#ffffff">Master Prompt AI</text>
    <text x="1160" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" fill="#e0f2fe">
      <tspan x="1160" dy="0">• Instan generate game HTML5 murni</tspan>
      <tspan x="1160" dy="36">• Tanpa server &amp; tanpa dependency</tspan>
      <tspan x="1160" dy="36">• Siap pakai untuk semua mata pelajaran</tspan>
    </text>
  </g>

  <line x1="120" y1="990" x2="1800" y2="990" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="120" y="1030" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" fill="#94a3b8">Gim Interaktif Informatika SMP · Media Pembelajaran Interaktif Layar Sentuh IFP</text>
  <text x="1800" y="1030" font-family="'JetBrains Mono', monospace" font-size="18" fill="#38bdf8" text-anchor="end">Slide 01 / 12</text>
</svg>
